    <script>
      (function () {
        var OrigWebSocket = window.WebSocket;
        if (!OrigWebSocket) return;
        function SafeWebSocket(url, protocols) {
          var isViteWs =
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (Array.isArray(protocols) &&
              (protocols.indexOf('vite-hmr') !== -1 ||
                protocols.indexOf('vite-ping') !== -1));
          if (isViteWs) {
            var dummy = new EventTarget();
            dummy.readyState = 1;
            dummy.OPEN = 1;
            dummy.CONNECTING = 0;
            dummy.CLOSING = 2;
            dummy.CLOSED = 3;
            dummy.send = function () {};
            dummy.close = function () {};
            dummy.addEventListener = EventTarget.prototype.addEventListener.bind(dummy);
            dummy.removeEventListener = EventTarget.prototype.removeEventListener.bind(dummy);
            return dummy;
          }
          return protocols !== undefined
            ? new OrigWebSocket(url, protocols)
            : new OrigWebSocket(url);
        }
        SafeWebSocket.prototype = OrigWebSocket.prototype;
        SafeWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
        SafeWebSocket.OPEN = OrigWebSocket.OPEN;
        SafeWebSocket.CLOSING = OrigWebSocket.CLOSING;
        SafeWebSocket.CLOSED = OrigWebSocket.CLOSED;
        window.WebSocket = SafeWebSocket;
      })();
    </script>
